<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Cómo funciona KOS / How KOS works">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#151515"/>
    </marker>
  </defs>
  <rect width="1200" height="380" fill="#F1F1EE"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="110" width="220" height="130" fill="#FFFFFF" stroke="#151515" stroke-width="2"/>
    <text x="150" y="160" font-size="26" font-weight="700" fill="#151515">Tú · You</text>
    <text x="150" y="196" font-size="16" fill="#3A3A3A">Pides algo en el chat</text>
    <text x="150" y="216" font-size="16" fill="#3A3A3A">Ask for something</text>

    <rect x="330" y="110" width="260" height="130" fill="#FFFFFF" stroke="#151515" stroke-width="2"/>
    <text x="460" y="160" font-size="26" font-weight="700" fill="#151515">Tu IA · Your AI</text>
    <text x="460" y="196" font-size="16" fill="#3A3A3A">Claude, ChatGPT, Codex,</text>
    <text x="460" y="216" font-size="16" fill="#3A3A3A">Cursor, Gemini</text>

    <rect x="660" y="110" width="260" height="130" fill="#FF5A1F" stroke="#FF5A1F" stroke-width="2"/>
    <text x="790" y="160" font-size="26" font-weight="700" fill="#FFFFFF">KOS</text>
    <text x="790" y="196" font-size="16" fill="#FFFFFF">Lee las reglas y registra</text>
    <text x="790" y="216" font-size="16" fill="#FFFFFF">Reads the rules, records</text>

    <rect x="960" y="110" width="200" height="130" fill="#FFFFFF" stroke="#151515" stroke-width="2"/>
    <text x="1060" y="160" font-size="26" font-weight="700" fill="#151515">Git</text>
    <text x="1060" y="196" font-size="16" fill="#3A3A3A">Historial y respaldo</text>
    <text x="1060" y="216" font-size="16" fill="#3A3A3A">History and backup</text>

    <text x="600" y="300" font-size="18" fill="#151515">Cierre: qué registró · cómo lo comprobó · qué falta</text>
    <text x="600" y="326" font-size="16" fill="#6E6E6B">Close: what was recorded · how it was checked · what is pending</text>
  </g>
  <g stroke="#151515" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="262" y1="175" x2="326" y2="175"/>
    <line x1="592" y1="175" x2="656" y2="175"/>
    <line x1="922" y1="175" x2="956" y2="175"/>
  </g>
  <path d="M790 240 L790 262 L460 262 L460 244" fill="none" stroke="#FF5A1F" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
</svg>
